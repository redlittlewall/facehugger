# 🎭 Manifesto: Mobile App
name: mobile-app
label: Mobile App
description: Configuração para apps mobile (Flutter, Kotlin, Swift)
tags: [mobile, app, flutter, android, ios]

domain_terms:
  - Screen: "Tela completa do app composta por múltiplos widgets"
  - Widget: "Componente de UI reutilizável (no Flutter)"
  - State: "Estado que dirige a UI em um dado momento"
  - BLoC: "Business Logic Component — padrão de gerenciamento de estado"
  - Navigation: "Sistema de roteamento entre telas"
  - UseCase: "Caso de uso que orquestra uma operação de negócio"

rules:
  - book: clean-code
    version: mini
    priority: high
  - book: a-philosophy-of-software-design
    version: mini
    priority: high
  - book: refactoring
    version: mini
    priority: medium
  - book: the-pragmatic-programmer
    version: mini
    priority: medium

recommended_skills:
  essential:
    - diagnose
    - tdd
    - grill-with-docs
    - triage
    - to-issues
    - to-prd
    - handoff
    - grill-me
  optional:
    - zoom-out
    - prototype
    - caveman
