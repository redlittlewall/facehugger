# 🎭 Manifesto: Backend API
name: backend-api
label: Backend API
description: Configuração para APIs REST, GraphQL, ou serviços backend
tags: [api, backend, server, service, microservice]

domain_terms:
  - Endpoint: "Ponto de entrada da API que expõe uma funcionalidade"
  - Service: "Classe com lógica de negócio orquestrando repositórios"
  - Repository: "Abstração sobre camada de dados com interface de coleção"
  - DTO: "Objeto que carrega dados entre processos (tipicamente na camada de controller)"
  - Entity: "Modelo de domínio com identidade e regras de negócio"
  - Middleware: "Função que intercepta requisições para validação, logging, etc."

rules:
  - book: clean-architecture
    version: mini
    priority: high
  - book: domain-driven-design-distilled
    version: mini
    priority: high
  - book: working-effectively-with-legacy-code
    version: mini
    priority: medium
  - book: a-philosophy-of-software-design
    version: mini
    priority: medium
  - book: refactoring-guru
    version: mini
    priority: low

recommended_skills:
  essential:
    - diagnose
    - tdd
    - grill-with-docs
    - triage
    - to-issues
    - to-prd
    - handoff
    - improve-codebase-architecture
    - grill-me
  optional:
    - zoom-out
    - prototype
    - caveman
