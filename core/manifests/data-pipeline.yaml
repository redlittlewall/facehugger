# 🎭 Manifesto: Data Pipeline
name: data-pipeline
label: Data Pipeline
description: Configuração para ETLs, processamento de dados, filas
tags: [data, etl, pipeline, streaming, batch]

domain_terms:
  - Pipeline: "Sequência de etapas de processamento de dados"
  - Source: "Origem dos dados (banco, API, arquivo, stream)"
  - Sink: "Destino dos dados processados"
  - Transformer: "Etapa que modifica ou enriquece os dados"
  - Batch: "Processamento de dados em lotes em intervalo programado"
  - Stream: "Processamento contínuo de dados em tempo real"

rules:
  - book: designing-data-intensive-applications
    version: mini
    priority: high
  - book: release-it
    version: mini
    priority: high
  - book: working-effectively-with-legacy-code
    version: nano
    priority: medium

recommended_skills:
  essential:
    - diagnose
    - tdd
    - grill-with-docs
    - handoff
    - grill-me
  optional:
    - zoom-out
    - caveman
