# 📚 Facehugger — Catálogo de Regras de Engenharia
#
# Livros disponíveis para inclusão em manifestos.
# Cada livro tem 3 versões:
#   - full: regras completas (máximo rigor)
#   - mini: essenciais (recomendado)
#   - nano: compactas (contexto apertado)
#
# Paths relativos ao submodule em vendor/agent-rules-books/

books:
  - id: clean-architecture
    label: Clean Architecture
    author: Robert C. Martin
    description: Sistemas com boundaries estáveis, separação de políticas de negócio de detalhes
    tags: [architecture, backend, api, design]
    path: clean-architecture/clean-architecture
    versions: [full, mini, nano]
    default_version: mini
    priority_weight: 8

  - id: working-effectively-with-legacy-code
    label: Working Effectively with Legacy Code
    author: Michael Feathers
    description: Como mudar código difícil com segurança — characterization tests, seams, sprout method
    tags: [legacy, refactoring, testing, backend, mobile, web]
    path: working-effectively-with-legacy-code/working-effectively-with-legacy-code
    versions: [full, mini, nano]
    default_version: mini
    priority_weight: 9

  - id: clean-code
    label: Clean Code
    author: Robert C. Martin
    description: Nomenclatura, funções pequenas, responsabilidades, testes, simplicidade
    tags: [general, readability, quality]
    path: clean-code/clean-code
    versions: [full, mini, nano]
    default_version: mini
    priority_weight: 7

  - id: a-philosophy-of-software-design
